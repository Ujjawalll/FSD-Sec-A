<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>condition</title>
</head>
<body>
    <script>
        let x = prompt("Enter a number to check if it is an Armstrong number or not: ");
        let pow = x.toString().length;
        let temp=x;
        let sum=0;
        while(temp>0){
            let rem=temp%10;
            sum = sum + Math.pow(rem,pow);
            temp=parseInt(temp/10);
        }
        if(sum == x){
            document.write(x + " is an Armstrong number");
        }
        else{
            document.write(x + " is not an Armstrong number");
        }
    </script>
</body>
</html>
